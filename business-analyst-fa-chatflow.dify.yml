      - id: "1738000012101"
        type: custom
        position:
          x: 1780
          y: 220
        width: 244
        height: 98
        sourcePosition: right
        targetPosition: left
        data:
          type: code
          title: استخراج پیش‌نویس
          desc: ""
          code_language: python3
          variables:
            - variable: llm_text
              value_selector:
                - "1738000007001"
                - text
            - variable: user_query
              value_selector:
                - sys
                - query
            - variable: existing_title
              value_selector:
                - conversation
                - project_title
          code: |
            def main(llm_text: str, user_query: str, existing_title: str) -> dict:
                text = llm_text or ""
                start = text.find("===DRAFT_APPEND===")
                end = text.find("===END_DRAFT===")
                draft = text
                if start != -1 and end != -1 and end > start:
                    draft = text[start + len("===DRAFT_APPEND==="):end].strip()
                display = text
                if start != -1:
                    display = text[:start].strip()
                title = (existing_title or "").strip()
                q = (user_query or "").strip()
                if q and not title:
                    title = q[:120]
                return {
                    "draft_text": draft,
                    "display_reply": display or text,
                    "project_title": title,
                }
          outputs:
            draft_text:
              type: string
              children: null
            display_reply:
              type: string
              children: null
            project_title:
              type: string
              children: null
      - id: "1738000013001"
        type: custom
        position:
          x: 1880
          y: 360
        width: 244
        height: 98
        sourcePosition: right
        targetPosition: left
        data:
          type: code
          title: قطع نسخه در حافظه
          desc: ""
          code_language: python3
          variables:
            - variable: llm_text
              value_selector:
                - "1738000008001"
                - text
            - variable: version_records
              value_selector:
                - conversation
                - version_records
            - variable: current_version_number
              value_selector:
                - conversation
                - current_version_number
            - variable: draft_requirements
              value_selector:
                - conversation
                - draft_requirements
            - variable: project_title
              value_selector:
                - conversation
                - project_title
          code: |
            def main(llm_text, version_records, current_version_number, draft_requirements, project_title):
                text = llm_text or ""
                start = text.find("===VERSION_DOCUMENT===")
                end = text.find("===END_VERSION===")
                doc = text.strip()
                if start != -1 and end != -1 and end > start:
                    doc = text[start + len("===VERSION_DOCUMENT==="):end].strip()
                display = text[:start].strip() if start != -1 else text
                records = list(version_records or [])
                draft = (draft_requirements or "").strip()
                if not draft and not doc:
                    return {
                        "version_records_out": records,
                        "new_version_number": int(current_version_number or 0),
                        "draft_clear": draft_requirements or "",
                        "display_reply": "پیش‌نویس خالی است. ابتدا نیازمندی ثبت کنید، سپس «نسخه را قطع کن».",
                    }
                new_num = int(current_version_number or 0) + 1
                record = {
                    "version": new_num,
                    "project_title": project_title or "",
                    "requirements_markdown_fa": doc,
                    "source_draft_snapshot": draft,
                }
                records.append(record)
                return {
                    "version_records_out": records,
                    "new_version_number": new_num,
                    "draft_clear": "",
                    "display_reply": (display + "\n\n✅ **نسخه " + str(new_num) + " قطع شد.** پیش‌نویس برای نسخه بعد خالی شد.").strip(),
                }
          outputs:
            version_records_out:
              type: array[object]
              children: null
            new_version_number:
              type: number
              children: null
            draft_clear:
              type: string
              children: null
            display_reply:
              type: string
              children: null
