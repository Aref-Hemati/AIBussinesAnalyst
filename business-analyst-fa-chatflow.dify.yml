version: "0.6.0"
kind: app
app:
  name: "تحلیلگر کسب‌وکار — نسخه‌بندی نیازمندی"
  mode: advanced-chat
  description: "دستیار تحلیلگر کسب‌وکار فارسی با قوانین سخت‌گیرانه سازمان، بارگذاری RFP، نسخه‌بندی نیازمندی و نمونه HTML."
  icon: "\U0001F4CB"
  icon_background: "#E8F4FD"
  icon_type: emoji
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  environment_variables: []
  conversation_variables:
    - id: "cv-org-hard-rules"
      name: org_hard_rules
      value_type: string
      description: "قوانین و استانداردهای اجباری سازمان (قابل بارگذاری یا به‌روزرسانی)"
      value: |
        [قوانین پیش‌فرض — پس از بارگذاری فایل استاندارد، این متن جایگزین می‌شود]
        1) زبان رابط کاربری: فارسی، راست‌به‌چپ (RTL)، تقویم شمسی در نمایش تاریخ.
        2) احراز هویت: یکپارچه با SSO سازمان؛ فرمت نام کاربری = کد پرسنلی ۸ رقمی؛ ورود با OTP پیامکی در صورت نیاز.
        3) فرم‌ها: برچسب بالای فیلد، پیام خطای فارسی، فیلدهای اجباری با *، دکمه اصلی «ذخیره» سمت راست.
        4) جداول: صفحه‌بندی، جستجو، خروجی Excel؛ ستون عملیات در سمت چپ.
        5) رنگ و چیدمان: مطابق Design System یکپارچه (هدر ثابت، منوی کناری، breadcrumb).
        6) یکپارچگی: API REST با JSON؛ شناسه‌های مرجع از سامانه‌های HR/مالی موجود.
        7) امنیت: RBAC، لاگ ممیزی، عدم ذخیره رمز عبور در لاگ.
    - id: "cv-draft-req"
      name: draft_requirements
      value_type: string
      description: "پیش‌نویس تجمیعی نیازمندی‌های نسخه جاری (قبل از قطع نسخه)"
      value: ""
    - id: "cv-version-num"
      name: current_version_number
      value_type: number
      description: "آخرین شماره نسخه قطع‌شده"
      value: 0
    - id: "cv-version-records"
      name: version_records
      value_type: array[object]
      description: "آرشیو نسخه‌های قطع‌شده"
      value: []
    - id: "cv-project-title"
      name: project_title
      value_type: string
      description: "عنوان پروژه / سامانه درخواستی"
      value: ""
    - id: "cv-last-file-text"
      name: last_uploaded_file_text
      value_type: string
      description: "متن استخراج‌شده از فایل‌های همین نوبت گفتگو"
      value: ""
  features:
    file_upload:
      enabled: true
      allowed_file_types:
        - document
        - image
      allowed_file_extensions:
        - .PDF
        - .DOC
        - .DOCX
        - .TXT
        - .MD
        - .CSV
        - .JSON
        - .YAML
        - .YML
        - .XLS
        - .XLSX
        - .HTML
        - .HTM
      allowed_file_upload_methods:
        - local_file
        - remote_url
      number_limits: 5
      image:
        enabled: true
        number_limits: 3
        transfer_methods:
          - local_file
          - remote_url
    opening_statement: |
      سلام. من **تحلیلگر کسب‌وکار** سامانه‌های یکپارچه شما هستم.

      **کارهایی که انجام می‌دهم:**
      - دریافت و **رعایت قوانین سخت‌گیرانه** (استاندارد فرم، ورود، یکپارچگی)
      - جمع‌آوری نیازمندی از گفتگو و **فایل RFP / نیازمندی**
      - **قطع نسخه** (نه تغییر بی‌پایان روی یک RFP)
      - ساخت **نمونه HTML فارسی** با داده نمایشی

      **راهنما:** فایل را پیوست کنید یا بنویسید:
      - «قوانین سازمان را از این فایل بخوان»
      - «این نیاز را ثبت کن»
      - «نسخه را قطع کن»
      - «نمونه HTML بساز»
    suggested_questions:
      - "قوانین و استاندارد UI/ورود سازمان را از فایل پیوست به‌روز کن"
      - "نیاز جدید: فرم ثبت درخواست با فیلدهای ضروری"
      - "نسخه فعلی نیازمندی را قطع و مستند کن"
      - "بر اساس نسخه فعلی یک نمونه HTML فارسی با داده دمو بساز"
    suggested_questions_after_answer:
      enabled: true
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
