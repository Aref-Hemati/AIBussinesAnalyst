      - id: "1738000011101"
        type: custom
        position:
          x: 1780
          y: 80
        width: 244
        height: 98
        sourcePosition: right
        targetPosition: left
        data:
          type: code
          title: استخراج بلوک قوانین
          desc: ""
          code_language: python3
          variables:
            - variable: llm_text
              value_selector:
                - "1738000006001"
                - text
          code: |
            def main(llm_text: str) -> dict:
                text = llm_text or ""
                start = text.find("===ORG_RULES_CANONICAL===")
                end = text.find("===END_ORG_RULES===")
                canonical = text
                if start != -1 and end != -1 and end > start:
                    canonical = text[start + len("===ORG_RULES_CANONICAL==="):end].strip()
                display = text
                if start != -1:
                    display = text[:start].strip()
                return {
                    "canonical_rules": canonical,
                    "display_reply": display or "قوانین به‌روزرسانی شد.",
                }
          outputs:
            canonical_rules:
              type: string
              children: null
            display_reply:
              type: string
              children: null
