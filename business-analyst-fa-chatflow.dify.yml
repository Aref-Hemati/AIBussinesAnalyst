        width: 244
        height: 54
        sourcePosition: right
        targetPosition: left
        data:
          type: document-extractor
          title: استخراج متن فایل
          desc: ""
          is_array_file: true
          variable_selector:
            - sys
            - files
      - id: "1738000003051"
        type: custom
        position:
          x: 830
          y: 180
        width: 244
        height: 98
        sourcePosition: right
        targetPosition: left
        data:
          type: code
          title: تجمیع متن فایل‌ها
          desc: ""
          code_language: python3
          variables:
            - variable: extracted
              value_selector:
                - "1738000003001"
                - text
          code: |
            def main(extracted) -> dict:
                if extracted is None:
                    return {"file_text": ""}
                if isinstance(extracted, list):
                    parts = [str(p).strip() for p in extracted if str(p).strip()]
                    return {"file_text": "\n\n---\n\n".join(parts)}
                return {"file_text": str(extracted)}
          outputs:
            file_text:
              type: string
              children: null
      - id: "1738000003501"
        type: custom
        position:
          x: 680
          y: 420
        width: 244
        height: 54
        sourcePosition: right
        targetPosition: left
        data:
          type: template-transform
          title: بدون فایل
          desc: ""
          template: " "
          variables: []
      - id: "1738000003601"
        type: custom
        position:
          x: 1080
          y: 180
        width: 244
        height: 98
        sourcePosition: right
        targetPosition: left
        data:
          type: assigner
          title: ذخیره متن فایل (با پیوست)
          desc: ""
          version: "2"
          items:
            - variable_selector:
                - conversation
                - last_uploaded_file_text
              input_type: variable
              operation: over-write
              value:
                - "1738000003051"
                - file_text
      - id: "1738000003602"
        type: custom
        position:
          x: 1080
          y: 420
        width: 244
        height: 98
        sourcePosition: right
        targetPosition: left
        data:
          type: assigner
          title: پاک کردن متن فایل (بدون پیوست)
          desc: ""
          version: "2"
          items:
            - variable_selector:
                - conversation
                - last_uploaded_file_text
              operation: clear
      - id: "1738000004001"
        type: custom
        position:
          x: 1280
          y: 300
        width: 244
        height: 178
        sourcePosition: right
        targetPosition: left
        data:
          type: question-classifier
          title: تشخیص نیت کاربر
          desc: ""
          query_variable_selector:
            - sys
            - query
          model:
            provider: langgenius/openai_api_compatible/openai_api_compatible
            name: openai/gpt-4o
            mode: chat
            completion_params:
              temperature: 0.2
          classes:
            - id: "cls-rules"
              name: "به‌روزرسانی یا بارگذاری قوانین سخت‌گیرانه سازمان (استاندارد UI، ورود، یکپارچگی)"
            - id: "cls-req"
              name: "ثبت، اصلاح یا جمع‌آوری نیازمندی / User Story در پیش‌نویس نسخه جاری"
            - id: "cls-version"
              name: "قطع نسخه، freeze، بستن دوره تغییرات RFP، مستندسازی نسخه"
            - id: "cls-demo"
              name: "ساخت یا نمایش نمونه HTML / پروتوتип رابط فارسی با داده دمو"
            - id: "cls-general"
              name: "گفتگوی تحلیل کسب‌وکار، سؤال، شفاف‌سازی، چالش سازنده"
          instruction: |
            زبان کاربر فارسی است. اگر هم‌زمان فایل RFP/استاندارد آپلود شده و متن مبهم است،
            اولویت با «قوانین» وقتی کاربر از استاندارد/قوانین/Design System صحبت کند؛
            با «ثبت نیاز» وقتی از قابلیت/فرم/گردش کار صحبت کند؛
            با «قطع نسخه» وقتی freeze/نسخه/تحویل فاز/بستن تغییرات گفت؛
            با «HTML» وقتی نمونه/دمو/پروتوتип/رابط خواست.
          memory:
            query_prompt_template: "{{#sys.query#}}"
            window:
              enabled: true
              size: 8
          vision:
            enabled: false
      - id: "1738000006001"
        type: custom
        position:
          x: 1580
          y: 80
        width: 244
        height: 98
        sourcePosition: right
        targetPosition: left
        data:
          type: llm
          title: تحلیل قوانین سازمان
          desc: ""
          model:
            provider: langgenius/openai_api_compatible/openai_api_compatible
            name: openai/gpt-4o
            mode: chat
            completion_params:
              temperature: 0.3
              max_tokens: 4096
          prompt_template:
            - id: "pt-rules-sys"
              role: system
              text: |
                تو تحلیلگر کسب‌وکار ارشد هستی. خروجی همیشه فارسی.
                وظیفه: استخراج/ادغام «قوانین سخت‌گیرانه» از پیام کاربر و متن فایل.
                قوانین باید قابل اجرا برای تیم توسعه باشند (ورود، فرم، layout، API، امنیت).
                اگر متن با قوانین قبلی تعارض دارد، تعارض را صریح بنویس و نسخه یکپارچه پیشنهاد بده.
                در پایان بخش جداگانه با عنوان دقیق:
                ===ORG_RULES_CANONICAL===
                (فقط متن قوانین نهایی برای ذخیره در سیستم)
                ===END_ORG_RULES===
            - id: "pt-rules-user"
              role: user
              text: |
                پیام کاربر:
                {{#sys.query#}}

                قوانین فعلی ذخیره‌شده:
                {{#conversation.org_hard_rules#}}

                متن استخراج‌شده از فایل این نوبت (در صورت خالی بودن نادیده بگیر):
                {{#conversation.last_uploaded_file_text#}}

                پاسخ: خلاصه تغییرات + تعارض‌ها + بلوک ORG_RULES_CANONICAL
          variables: []
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
          memory:
            query_prompt_template: "{{#sys.query#}}"
            window:
              enabled: true
              size: 6
      - id: "1738000007001"
        type: custom
        position:
          x: 1580
          y: 220
        width: 244
        height: 98
        sourcePosition: right
        targetPosition: left
        data:
          type: llm
          title: ثبت نیازمندی
          desc: ""
          model:
            provider: langgenius/openai_api_compatible/openai_api_compatible
            name: openai/gpt-4o
            mode: chat
            completion_params:
              temperature: 0.4
              max_tokens: 4096
          prompt_template:
            - id: "pt-req-sys"
              role: system
              text: |
                تو تحلیلگر کسب‌وکار هستی. زبان: فارسی.
                اصل: به درخواست صریح کاربر پایبند باش، اما نیاز واقعی پشت درخواست را با سؤال‌های هدفمند (حداکثر ۳ سؤال) کشف کن.
                هر نیاز را با قوانین سازمان تطبیق بده؛ نقض قانون = «رد/نیاز به استثناء» با دلیل.
                خروجی ساخت‌یافته:
                1) فهم از نیاز
                2) موارد پذیرفته‌شده (شناسه REQ-xxx)
                3) موارد نیازمند توضیح
                4) مغایرت با قوانین
                5) پیشنهاد تحلیلگر (در صورت بهبود بدون دور زدن خواست کاربر)
                در پایان بلوک:
                ===DRAFT_APPEND===
                (متن markdown تجمیعی پیش‌نویس نسخه جاری؛ شامل همه REQها تا این لحظه)
                ===END_DRAFT===
            - id: "pt-req-user"
              role: user
              text: |
                پیام کاربر:
                {{#sys.query#}}

                عنوان پروژه: {{#conversation.project_title#}}
                شماره آخرین نسخه قطع‌شده: {{#conversation.current_version_number#}}
                پیش‌نویس فعلی:
                {{#conversation.draft_requirements#}}

